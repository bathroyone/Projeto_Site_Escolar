<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online | Site da Escola</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .chat-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #063b7a 0%, #13843b 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(6, 59, 122, 0.4);
            transition: all 0.3s ease;
        }
        
        .chat-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(6, 59, 122, 0.5);
        }
        
        .chat-window {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 350px;
            max-width: calc(100vw - 40px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: none;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .chat-header {
            background: linear-gradient(135deg, #063b7a 0%, #13843b 100%);
            padding: 20px;
            color: white;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 400px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            max-width: 80%;
        }
        
        .message.user {
            margin-left: auto;
        }
        
        .message.bot {
            margin-right: auto;
        }
        
        .message-content {
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #063b7a 0%, #0b4a8c 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }
        
        .chat-input {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }
        
        .chat-input input:focus {
            border-color: #063b7a;
        }
        
        .chat-input button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #063b7a 0%, #13843b 100%);
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .chat-input button:hover {
            transform: scale(1.1);
        }
        
        .typing-indicator {
            display: none;
            padding: 10px;
            color: #666;
            font-size: 12px;
        }
        
        .typing-indicator.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen">
    <!-- Widget de Chat -->
    <div class="chat-widget">
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-lg">Chat Online</h3>
                        <p class="text-sm opacity-80">Estamos online para ajudar!</p>
                    </div>
                    <button onclick="toggleChat()" class="text-white hover:opacity-80 transition-opacity">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content">
                        Olá! Bem-vindo ao chat da escola. Como posso ajudar você hoje?
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator">
                <i class="fas fa-ellipsis-h"></i> Digitando...
            </div>
            
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
        
        <button class="chat-button" onclick="toggleChat()" id="chatButton">
            <i class="fas fa-comments text-white text-2xl"></i>
        </button>
    </div>

    <script>
        let chatOpen = false;
        
        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            const chatButton = document.getElementById('chatButton');
            
            chatOpen = !chatOpen;
            
            if (chatOpen) {
                chatWindow.style.display = 'flex';
                chatButton.innerHTML = '<i class="fas fa-times text-white text-2xl"></i>';
            } else {
                chatWindow.style.display = 'none';
                chatButton.innerHTML = '<i class="fas fa-comments text-white text-2xl"></i>';
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message === '') return;
            
            addMessage(message, 'user');
            input.value = '';
            
            // Simular resposta do bot
            showTyping();
            setTimeout(() => {
                hideTyping();
                const response = getBotResponse(message);
                addMessage(response, 'bot');
            }, 1500);
        }
        
        function addMessage(text, type) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function showTyping() {
            document.getElementById('typingIndicator').classList.add('active');
        }
        
        function hideTyping() {
            document.getElementById('typingIndicator').classList.remove('active');
        }
        
        function getBotResponse(message) {
            const lowerMessage = message.toLowerCase();
            
            if (lowerMessage.includes('matrícula') || lowerMessage.includes('matricula')) {
                return 'Para informações sobre matrículas, você pode acessar o link de Pré-Matrícula na página inicial ou entrar em contato com a secretaria.';
            } else if (lowerMessage.includes('horário') || lowerMessage.includes('horario')) {
                return 'Nossa escola funciona das 7h às 17h, de segunda a sexta-feira. Para mais informações, entre em contato conosco.';
            } else if (lowerMessage.includes('valor') || lowerMessage.includes('mensalidade') || lowerMessage.includes('preço')) {
                return 'Os valores das mensalidades variam de acordo com o ano escolar. Entre em contato com a secretaria para obter informações detalhadas.';
            } else if (lowerMessage.includes('visita') || lowerMessage.includes('conhecer')) {
                return 'Você pode agendar uma visita à escola clicando no botão "Agendar Visita" na página principal!';
            } else if (lowerMessage.includes('contato') || lowerMessage.includes('telefone') || lowerMessage.includes('email')) {
                return 'Você pode entrar em contato conosco pelo telefone (00) 0000-0000 ou pelo email contato@escola.com.br';
            } else if (lowerMessage.includes('obrigado') || lowerMessage.includes('valeu')) {
                return 'Por nada! Estamos sempre à disposição para ajudar. Tem mais alguma dúvida?';
            } else {
                return 'Obrigado pela sua mensagem! Um de nossos atendentes entrará em contato em breve. Enquanto isso, você pode nos chamar pelo telefone (00) 0000-0000.';
            }
        }
    </script>
</body>
</html>
